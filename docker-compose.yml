services:
  duenext-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DUENEXT_DATA_PATH}/postgres:/var/lib/postgresql/data
    networks:
      - duenext-network

  duenext-app:
    image: ghcr.io/kaiserdrake/duenext:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - duenext-db
    networks:
      - duenext-network

networks:
  duenext-network:
    driver: bridge
