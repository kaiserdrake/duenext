services:
  duenext-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DUENEXT_DATA_PATH}/postgres:/var/lib/postgresql/data
    networks:
      - duenext-network

  duenext-app:
    image: ghcr.io/kaiserdrake/duenext:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - duenext-db
    networks:
      - duenext-network
    extra_hosts:
      # Router doesn't support NAT hairpinning, so resolving the public
      # hostname from inside the LAN times out connecting back to itself.
      # Point straight at the LAN IP of the NPM/ntfy host instead.
      - "ntfy.laeradsphere.com:192.168.1.2"
    labels:
      # Shown as the container's icon in Unraid's Docker tab.
      net.unraid.docker.icon: "https://raw.githubusercontent.com/kaiserdrake/duenext/main/public/logo.png"

networks:
  duenext-network:
    driver: bridge
